<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Canocchi POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0;}
.hidden{display:none;}
#login-view{text-align:center;margin-top:60px;}
#login-view img{width:170px;margin-bottom:20px;}
input{width:100%;padding:10px;margin:6px 0;border-radius:6px;border:1px solid #ccc;}
.btn{padding:10px;border:none;border-radius:6px;cursor:pointer;}
.btn-rojo{background:#E53935;color:#fff;}
.btn-negro{background:#000;color:#fff;}
.card{background:#fff;padding:15px;border-radius:8px;max-width:900px;margin:15px auto;}
table{width:100%;border-collapse:collapse;}
td,th{border:1px solid #ccc;padding:6px;}
#scanner{width:100%;height:250px;background:#000;margin-top:10px;}
</style>
</head>

<body>

<div id="login-view">
<img src="CanocchiLogo.PNG">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button class="btn btn-rojo" id="btnLogin">Ingresar</button>
<div id="login-msg" style="color:red;"></div>
</div>

<div id="pos-view" class="hidden card">

<div style="display:flex;justify-content:space-between;">
<h2>Canocchi POS</h2>
<div>
<span id="empleado-label"></span>
<button class="btn btn-rojo" id="logoutBtn">Salir</button>
</div>
</div>

<hr>

<input id="codigo-input" placeholder="Código">

<table>
<thead>
<tr><th>Producto</th><th>Precio</th><th></th></tr>
</thead>
<tbody id="carrito"></tbody>
</table>

<h3 style="text-align:right;">Total: $<span id="total">0</span></h3>

<button class="btn btn-rojo hidden" id="btnPagar">Pagar</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSyBg4WAoETa4fzO_eia4Nc9PraW_dkmeA4w",
projectId:"canocchi-store---stock-control"
});

const db = getFirestore(app);

let carrito=[];
let empleado=null;

// LOGIN
document.getElementById("btnLogin").onclick=async()=>{
const u=user.value.trim();
const p=pass.value.trim();

const snap=await getDocs(collection(db,"empleados"));

let ok=false;

snap.forEach(d=>{
const data=d.data();
if(data.usuario===u && data.password===p) ok=true;
});

if(!ok){
document.getElementById("login-msg").textContent="Datos incorrectos";
return;
}

empleado=u;
login-view.classList.add("hidden");
pos-view.classList.remove("hidden");
empleado-label.textContent=u;
};

// AGREGAR PRODUCTO
codigo-input.addEventListener("keydown",e=>{
if(e.key==="Enter"){
carrito.push({nombre:"Producto",precio:100});
render();
}
});

// RENDER (SIN ERRORES)
function render(){
let total=0;
carrito.innerHTML="";

carrito.forEach((p,i)=>{
total+=p.precio;

document.getElementById("carrito").innerHTML += <tr> <td>${p.nombre}</td> <td>${p.precio}</td> <td><button onclick="del(${i})">X</button></td> </tr>;
});

document.getElementById("total").textContent=total;
}

// DELETE
window.del=i=>{
carrito.splice(i,1);
render();
};

</script>

</body>
</html>
