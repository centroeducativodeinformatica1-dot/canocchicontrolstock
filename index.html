<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Canocchi POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f5f5f5;margin:0;}
.hidden{display:none;}
#login-view{text-align:center;margin-top:60px;}
#login-view img{width:170px;margin-bottom:20px;}
input{width:100%;padding:10px;margin:6px 0;border-radius:6px;border:1px solid #ccc;}
button{padding:10px;border:none;border-radius:6px;cursor:pointer;}
.btn-rojo{background:#E53935;color:#fff;}
.card{background:#fff;padding:15px;border-radius:8px;max-width:900px;margin:15px auto;}
table{width:100%;border-collapse:collapse;}
td,th{border:1px solid #ccc;padding:6px;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-view">
<img src="CanocchiLogo.PNG">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button class="btn-rojo" id="btnLogin">Ingresar</button>
<div id="login-msg" style="color:red;"></div>
</div>

<!-- POS -->
<div id="pos-view" class="hidden card">

<div style="display:flex;justify-content:space-between;">
<h2>Canocchi POS</h2>
<div>
<span id="empleado-label"></span>
<button class="btn-rojo" id="logoutBtn">Salir</button>
</div>
</div>

<hr>

<input id="codigo-input" placeholder="Código producto">

<table>
<thead>
<tr>
<th>Producto</th>
<th>Precio</th>
<th></th>
</tr>
</thead>
<tbody id="carrito-body"></tbody>
</table>

<h3 style="text-align:right;">Total: $<span id="total">0</span></h3>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBg4WAoETa4fzO_eia4Nc9PraW_dkmeA4w",
  authDomain: "canocchi-store---stock-control.firebaseapp.com",
  projectId: "canocchi-store---stock-control"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let carrito = [];
let empleado = null;

// LOGIN
document.getElementById("btnLogin").addEventListener("click", async ()=>{

const u = document.getElementById("user").value.trim();
const p = document.getElementById("pass").value.trim();

const snap = await getDocs(collection(db,"empleados"));

let ok = false;

snap.forEach(doc=>{
const data = doc.data();
if(data.usuario === u && data.password === p){
ok = true;
}
});

if(!ok){
document.getElementById("login-msg").textContent = "Usuario o contraseña incorrectos";
return;
}

empleado = u;

document.getElementById("login-view").classList.add("hidden");
document.getElementById("pos-view").classList.remove("hidden");
document.getElementById("empleado-label").textContent = u;

});

// LOGOUT
document.getElementById("logoutBtn").addEventListener("click", ()=>{
location.reload();
});

// DEMO: agregar producto al presionar Enter
document.getElementById("codigo-input").addEventListener("keydown", e=>{
if(e.key === "Enter"){
agregarProducto();
}
});

function agregarProducto(){

const producto = {
nombre: "Producto demo",
precio: 1000
};

carrito.push(producto);
render();

}

// RENDER
function render(){

let total = 0;
const tbody = document.getElementById("carrito-body");
tbody.innerHTML = "";

carrito.forEach((item, index)=>{

total += item.precio;

const fila = <tr> <td>${item.nombre}</td> <td>${item.precio}</td> <td><button onclick="eliminarItem(${index})">X</button></td> </tr>;

tbody.innerHTML += fila;

});

document.getElementById("total").textContent = total;

}

// ELIMINAR
window.eliminarItem = function(index){
carrito.splice(index,1);
render();
};

</script>

</body>
</html>
