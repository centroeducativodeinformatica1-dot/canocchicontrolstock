!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Canocchi Control</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  height: 60px;
}

input, button {
  padding: 10px;
  margin: 5px;
}

#carrito {
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="header">
  <h2>Canocchi Control</h2>
  <img src="logo.png" class="logo">
</div>

<h3>Agregar producto</h3>
<input id="nombre" placeholder="Nombre">
<input id="precio" type="number" placeholder="Precio">
<input id="cantidad" type="number" placeholder="Cantidad">
<input id="codigo" placeholder="Código de barras">
<button onclick="agregarProducto()">Guardar</button>

<hr>

<h3>Venta</h3>
<input id="scanner" placeholder="Escanear código" autofocus>

<div id="carrito"></div>

<button onclick="confirmarVenta()">Confirmar venta</button>

<h3 id="resumen"></h3>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// 🔥 TU CONFIG (YA LISTA)
const firebaseConfig = {
  apiKey: "AIzaSyDSKVd4-PMXxupXvil7Hbfpt6EZbOKef4o",
  authDomain: "control-dee-stock-canocchi.firebaseapp.com",
  projectId: "control-dee-stock-canocchi",
  storageBucket: "control-dee-stock-canocchi.firebasestorage.app",
  messagingSenderId: "100048512779",
  appId: "1:100048512779:web:bc5bbcb7134a8758aca40e",
  measurementId: "G-6V00ED8HG7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let productos = [];
let carrito = [];

// 📦 Cargar productos
async function cargarProductos() {
  const snapshot = await getDocs(collection(db, "productos"));
  productos = [];
  snapshot.forEach(docu => {
    productos.push({ id: docu.id, ...docu.data() });
  });
}

// ➕ Agregar producto
window.agregarProducto = async function() {
  let nombre = document.getElementById("nombre").value;
  let precio = parseFloat(document.getElementById("precio").value);
  let cantidad = parseInt(document.getElementById("cantidad").value);
  let codigo = document.getElementById("codigo").value;

  await addDoc(collection(db, "productos"), {
    nombre, precio, cantidad, codigo
  });

  alert("Producto guardado");
  cargarProductos();
}

// 🔫 Escáner
document.getElementById("scanner").addEventListener("change", function() {
  let codigo = this.value;

  let producto = productos.find(p => p.codigo == codigo);

  if (producto && producto.cantidad > 0) {
    carrito.push(producto);
    renderCarrito();
  } else {
    alert("No hay stock o no existe");
  }

  this.value = "";
});

// 🛒 Mostrar carrito
function renderCarrito() {
  let html = "";
  let total = 0;

  carrito.forEach(p => {
    html += <p>${p.nombre} - $${p.precio}</p>;
    total += p.precio;
  });

  html += <strong>Total: $${total}</strong>;

  document.getElementById("carrito").innerHTML = html;
}

// 💸 Confirmar venta
window.confirmarVenta = async function() {
  let fecha = new Date();
  let total = 0;

  for (let item of carrito) {
    total += item.precio;

    await updateDoc(doc(db, "productos", item.id), {
      cantidad: item.cantidad - 1
    });
  }

  await addDoc(collection(db, "ventas"), {
    fecha: fecha.toLocaleDateString(),
    hora: fecha.toLocaleTimeString(),
    items: carrito,
    total
  });

  carrito = [];
  await cargarProductos();
  renderCarrito();
  resumenHoy();
}

// 📊 Resumen del día
async function resumenHoy() {
  const snapshot = await getDocs(collection(db, "ventas"));

  let hoy = new Date().toLocaleDateString();

  let total = 0;
  let cantidad = 0;

  snapshot.forEach(docu => {
    let v = docu.data();

    if (v.fecha === hoy) {
      total += v.total;
      cantidad += v.items.length;
    }
  });

  document.getElementById("resumen").innerText =
    Hoy vendiste ${cantidad} productos — $${total};
}

// INIT
cargarProductos();
resumenHoy();

</script>

</body>
</html>
