<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Canocchi POS PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body { font-family: Arial; background:#f5f5f5; margin:0; }
.hidden { display:none; }
.card { background:#fff; padding:15px; border-radius:8px; max-width:900px; margin:15px auto; }
input { width:100%; padding:10px; margin:6px 0; border-radius:6px; border:1px solid #ccc; }
.btn-rojo { background:#E53935;color:#fff;border:none;padding:10px;border-radius:6px;cursor:pointer; }
.btn-negro { background:#000;color:#fff;border:none;padding:10px;border-radius:6px;cursor:pointer; }
table { width:100%; border-collapse:collapse; margin-top:10px;}
td,th{border:1px solid #ccc;padding:6px;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-view" class="card">
<h2>Canocchi POS</h2>
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button class="btn-rojo" onclick="doLogin()">Ingresar</button>
<div id="login-msg"></div>
</div>

<!-- POS -->
<div id="pos-view" class="hidden card">

<div style="display:flex;justify-content:space-between;">
<div>
<h3>POS</h3>
<span id="empleado-label"></span>
</div>
<div>
<button class="btn-rojo" onclick="logout()">Salir</button>
</div>
</div>

<hr>

<button onclick="abrirCaja()">Abrir Caja</button>
<button onclick="cerrarCaja()">Cerrar Caja</button>
<button onclick="dashboard()">Dashboard</button>

<input id="codigo-input" placeholder="Código" onkeydown="if(event.key==='Enter')buscarCodigo()">
<button onclick="buscarCodigo()">Agregar</button>

<table>
<thead><tr><th>Nombre</th><th>Cant</th><th>Precio</th><th></th></tr></thead>
<tbody id="carrito"></tbody>
</table>

<h3>Total: $<span id="total">0</span></h3>
<button class="btn-rojo" onclick="pagar()">Pagar</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore, collection, query, where, getDocs, addDoc, updateDoc, doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = { /* TU CONFIG / };

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let carrito = [];
let user=null, rol=null, sucursal=null;
let cajaAbierta=false;

/ LOGIN /
window.doLogin = async ()=>{
const u=user=document.getElementById("user").value;
const p=document.getElementById("pass").value;

const q=query(collection(db,"empleados"),where("usuario","==",u),where("password","==",p));
const s=await getDocs(q);

if(s.empty){alert("Error login");return;}

const d=s.docs[0].data();
rol=d.rol; sucursal=d.sucursal;

localStorage.setItem("user",u);
localStorage.setItem("rol",rol);
localStorage.setItem("sucursal",sucursal);

init();
};

/ AUTO LOGIN /
window.onload=()=>{
if(localStorage.getItem("user")){
user=localStorage.getItem("user");
rol=localStorage.getItem("rol");
sucursal=localStorage.getItem("sucursal");
init();
}
};

function init(){
login-view.classList.add("hidden");
pos-view.classList.remove("hidden");
empleado-label.innerText=user+" ("+rol+")";
}

/ LOGOUT /
window.logout=()=>{localStorage.clear();location.reload();};

/ BUSCAR /
window.buscarCodigo=async ()=>{
const code=codigo-input.value;

const q=query(collection(db,"productos"),where("codigo","==",code));
const s=await getDocs(q);

if(s.empty){alert("No existe");return;}

const p=s.docs[0].data();

if(p.stock<=0){alert("Sin stock");return;}

carrito.push(p);
render();
};

/ RENDER /
function render(){
let t=0;
carrito.innerHTML="";
carrito.forEach((p,i)=>{
t+=p.precio;
carrito.innerHTML+=<tr> <td>${p.nombre}</td> <td>1</td> <td>${p.precio}</td> <td><button onclick="del(${i})">X</button></td> </tr>;
});
total.innerText=t;
}

/ ELIMINAR /
window.del=i=>{carrito.splice(i,1);render();};

/ PAGO + STOCK /
window.pagar=async ()=>{
if(!cajaAbierta){alert("Abrí caja");return;}

for(const p of carrito){
const q=query(collection(db,"productos"),where("codigo","==",p.codigo));
const s=await getDocs(q);
const ref=doc(db,"productos",s.docs[0].id);
await updateDoc(ref,{stock:p.stock-1});
}

await addDoc(collection(db,"ventas"),{
fecha:Date.now(),
user,
sucursal,
total:Number(total.innerText),
items:carrito
});

carrito=[];
render();
alert("Venta OK");
};

/ CAJA /
window.abrirCaja=()=>{cajaAbierta=true;alert("Caja abierta");};
window.cerrarCaja=()=>{cajaAbierta=false;alert("Caja cerrada");};

/ DASHBOARD */
window.dashboard=async ()=>{
const s=await getDocs(collection(db,"ventas"));
let total=0;
s.forEach(d=>total+=d.data().total);
alert("Total vendido: $"+total);
};

</script>
</body>
</html>
