<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Canocchi Stock</title>

<style>
body { font-family: Arial; margin:0; background:#f5f5f5; }

#login {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

#login img { width:180px; margin-bottom:20px; }

input, select {
  padding:10px;
  margin:5px;
  width:220px;
  border-radius:6px;
  border:1px solid #ccc;
}

button {
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.btn-rojo { background:#d60000; color:white; }

#error { color:red; }

#app { display:none; padding:20px; }

h1 { color:#d60000; }

.seccion {
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

.producto {
  display:flex;
  justify-content:space-between;
  padding:6px;
  border-bottom:1px solid #eee;
}

.stock-bajo { color:orange; }
.stock-critico { color:red; font-weight:bold; }

img.icon { width:20px; }

#formProducto {
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

#noti {
  position:fixed;
  top:20px;
  right:20px;
  background:#d60000;
  color:white;
  padding:10px;
  border-radius:8px;
  display:none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <img src="CanocchiLogo.PNG">
  <input id="user" placeholder="Usuario">
  <input id="pass" type="password" placeholder="Contraseña">
  <button id="btnLogin" class="btn-rojo">Iniciar sesión</button>
  <div id="error"></div>
</div>

<!-- APP -->
<div id="app">
  <h1>Control de Stock</h1>

  <input id="buscador" placeholder="Buscar...">

  <button id="excelBtn">
    <img src="logoexcel.png" style="width:26px;">
  </button>

  <div id="formProducto">
    <select id="f_seccion"></select>
    <input id="f_nombre" placeholder="Nombre">
    <input id="f_marca" placeholder="Marca">
    <input id="f_cantidad" type="number" placeholder="Cantidad">
    <input id="f_codigo" placeholder="Escanear código">
    <button id="guardarBtn" class="btn-rojo">Guardar</button>
  </div>

  <div id="contenedor"></div>

  <button id="btnSeccion" class="btn-rojo">+ Sección</button>
</div>

<div id="noti"></div>

<script>
document.addEventListener("DOMContentLoaded", function(){

// 🔐 LOGIN
const USER = "Canocchi";
const PASS = "Guemes1194";

const btnLogin = document.getElementById("btnLogin");
const userInput = document.getElementById("user");
const passInput = document.getElementById("pass");

btnLogin.addEventListener("click", function(){
  const u = userInput.value.trim();
  const p = passInput.value.trim();

  if(u === USER && p === PASS){
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    cargarSecciones();
    render();
  } else {
    document.getElementById("error").innerText = "Datos incorrectos";
  }
});

// DATA
let data = JSON.parse(localStorage.getItem("stock")) || {
  "Golosinas": []
};

function save(){
  localStorage.setItem("stock", JSON.stringify(data));
}

// SECCIONES
function cargarSecciones(){
  const sel = document.getElementById("f_seccion");
  sel.innerHTML = "";

  Object.keys(data).sort().forEach(s=>{
    const op = document.createElement("option");
    op.value = s;
    op.textContent = s;
    sel.appendChild(op);
  });
}

// RENDER
function render(){
  const cont = document.getElementById("contenedor");
  cont.innerHTML = "";

  Object.keys(data).sort().forEach(sec=>{
    const div = document.createElement("div");
    div.className = "seccion";
    div.innerHTML = "<h2>"+sec+"</h2>";

    data[sec].forEach(p=>{
      const el = document.createElement("div");
      el.className = "producto";
      el.innerHTML = p.nombre+" - "+p.cantidad;
      div.appendChild(el);
    });

    cont.appendChild(div);
  });
}

// GUARDAR PRODUCTO
document.getElementById("guardarBtn").addEventListener("click", function(){

  const sec = document.getElementById("f_seccion").value;
  const nombre = document.getElementById("f_nombre").value;
  const cantidad = parseInt(document.getElementById("f_cantidad").value);
  const codigo = document.getElementById("f_codigo").value;

  if(!nombre || isNaN(cantidad)){
    alert("Faltan datos");
    return;
  }

  let existente = data[sec].find(p=>p.codigo===codigo && codigo);

  if(existente){
    existente.cantidad += cantidad;
  } else {
    data[sec].push({nombre,cantidad,codigo});
  }

  save();
  render();
});

// SECCION
document.getElementById("btnSeccion").addEventListener("click", function(){
  const n = prompt("Nombre sección:");
  if(!n) return;
  data[n] = [];
  save();
  cargarSecciones();
  render();
});

// EXCEL
document.getElementById("excelBtn").addEventListener("click", function(){
  let filas=[["Sección","Nombre","Cantidad"]];
  Object.keys(data).forEach(sec=>{
    data[sec].forEach(p=>{
      filas.push([sec,p.nombre,p.cantidad]);
    });
  });
  let csv=filas.map(f=>f.join(",")).join("\n");
  let a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv]));
  a.download="stock.csv";
  a.click();
});

});
</script>

</body>
</html>
