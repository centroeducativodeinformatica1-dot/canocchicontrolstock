<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Canocchi POS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Quagga2 (cámara) como script global -->
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>

  <style>
    body { font-family: Arial, sans-serif; padding: 10px; background:#f5f5f5; }
    .hidden { display:none; }
    .card { background:#fff; padding:15px; border-radius:8px; max-width:800px; margin:10px auto; box-shadow:0 2px 6px rgba(0,0,0,.1); }
    table { width:100%; border-collapse: collapse; margin-top:10px; }
    th, td { border:1px solid #ccc; padding:6px; font-size:14px; }
    th { background:#eee; }
    input, button { padding:8px; margin:4px 0; font-size:14px; }
    button { cursor:pointer; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="card" id="login-view">
  <h2>Iniciar sesión</h2>
  <label>Usuario</label><br>
  <input id="user" placeholder="Usuario"><br>
  <label>Contraseña</label><br>
  <input id="pass" type="password" placeholder="Contraseña"><br>
  <button onclick="doLogin()">Ingresar</button>
  <div id="login-msg" style="color:red;margin-top:6px;"></div>
</div>

<!-- POS -->
<div class="card hidden" id="pos-view">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h3>Caja POS</h3>
    <span>Empleado: <strong id="empleado-label"></strong></span>
  </div>
  <hr>

  <h4>Escaneo / carga de producto</h4>
  <input id="codigo-input"
         placeholder="Escaneá con la pistola o escribí el código"
         onkeydown="if(event.key==='Enter') buscarCodigo()">
  <button onclick="buscarCodigo()">Agregar</button>
  <button onclick="toggleCam()">Cámara</button>
  <div id="scan-msg" style="color:green;margin-top:4px;"></div>

  <div id="scanner-area" class="hidden"
       style="width:100%;height:250px;background:#000;margin-top:10px;"></div>

  <h4>Carrito</h4>
  <table>
    <thead>
      <tr>
        <th>Código</th>
        <th>Nombre</th>
        <th>Cant.</th>
        <th>Precio</th>
        <th>Subtotal</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="carrito-body"></tbody>
  </table>

  <p style="text-align:right;margin-top:8px;">
    Total: $<span id="total-label">0</span>
  </p>
</div>

<!-- ALTA DE PRODUCTO -->
<div class="card hidden" id="alta-container">
  <h3>Agregar producto</h3>
  <label>Código</label><br>
  <input id="alta-codigo" readonly><br>
  <label>Nombre</label><br>
  <input id="alta-nombre"><br>
  <label>Precio</label><br>
  <input id="alta-precio" type="number" step="0.01"><br>
  <label>Stock inicial</label><br>
  <input id="alta-stock" type="number"><br>
  <button onclick="guardarProducto()">Guardar</button>
  <button onclick="document.getElementById('alta-container').classList.add('hidden')">Cancelar</button>
</div>

<!-- LÓGICA (Firebase + POS) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    addDoc
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // TU CONFIG DE FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyB4gAWoETaf4f2O_eia4Nc9PraW_dkmeA4w",
    authDomain: "canocchi-store---stock-control.firebaseapp.com",
    projectId: "canocchi-store---stock-control",
    storageBucket: "canocchi-store---stock-control.firebasestorage.app",
    messagingSenderId: "106236604495",
    appId: "1:106236604495:web:2af8b907cc568d11fa1f5a",
    measurementId: "G-9EB7X6949"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let empleadoActual = null;
  let carrito = [];

  /* ---------- LOGIN ---------- */
  window.doLogin = async function () {
    const usuario = document.getElementById("user").value.trim();
    const password = document.getElementById("pass").value.trim();
    const msg = document.getElementById("login-msg");
    msg.textContent = "";

    if (!usuario || !password) {
      msg.textContent = "Completá usuario y contraseña.";
      return;
    }

    const q = query(
      collection(db, "empleados"),
      where("usuario", "==", usuario),
      where("password", "==", password)
    );

    const snap = await getDocs(q);

    if (snap.empty) {
      msg.textContent = "Usuario o contraseña incorrectos.";
      return;
    }

    const data = snap.docs[0].data();
    empleadoActual = data.nombre;

    document.getElementById("empleado-label").textContent = data.nombre;
    document.getElementById("login-view").classList.add("hidden");
    document.getElementById("pos-view").classList.remove("hidden");
  };

  /* ---------- BUSCAR PRODUCTO ---------- */
  window.buscarCodigo = async function (manualCode) {
    const input = document.getElementById("codigo-input");
    const codigo = (manualCode || input.value).trim();
    const msg = document.getElementById("scan-msg");
    msg.textContent = "";

    if (!codigo) return;

    const q = query(
      collection(db, "productos"),
      where("codigo", "==", codigo),
      where("activo", "==", true)
    );

    const snap = await getDocs(q);

    if (snap.empty) {
      msg.textContent = "Producto no encontrado. Podés agregarlo.";
      document.getElementById("alta-container").classList.remove("hidden");
      document.getElementById("alta-codigo").value = codigo;
      return;
    }

    const prod = snap.docs[0].data();
    agregarAlCarrito(prod);
    msg.textContent = "Producto agregado: " + prod.nombre;

    input.value = "";
    input.focus();
  };

  /* ---------- ALTA DE PRODUCTO ---------- */
  window.guardarProducto = async function () {
    const codigo = document.getElementById("alta-codigo").value.trim();
    const nombre = document.getElementById("alta-nombre").value.trim();
    const precio = Number(document.getElementById("alta-precio").value);
    const stock = Number(document.getElementById("alta-stock").value);

    if (!codigo || !nombre || !precio || !stock) {
      alert("Completá todos los campos.");
      return;
    }

    await addDoc(collection(db, "productos"), {
      codigo,
      nombre,
      precio,
      stock,
      activo: true
    });

    alert("Producto agregado.");
    document.getElementById("alta-container").classList.add("hidden");
    document.getElementById("alta-nombre").value = "";
    document.getElementById("alta-precio").value = "";
    document.getElementById("alta-stock").value = "";
  };

  /* ---------- CARRITO ---------- */
  function agregarAlCarrito(prod) {
    const existe = carrito.find(i => String(i.codigo) === String(prod.codigo));
    if (existe) {
      existe.cantidad++;
    } else {
      carrito.push({
        codigo: prod.codigo,
        nombre: prod.nombre,
        precio: Number(prod.precio),
        cantidad: 1
      });
    }
    renderCarrito();
  }

  function renderCarrito() {
    const tbody = document.getElementById("carrito-body");
    tbody.innerHTML = "";
    let total = 0;

    carrito.forEach((item, i) => {
      const sub = item.cantidad * item.precio;
      total += sub;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${item.codigo}</td>
        <td>${item.nombre}</td>
        <td><input type="number" min="1" value="${item.cantidad}" style="width:60px;"></td>
        <td>${item.precio.toFixed(2)}</td>
        <td>${sub.toFixed(2)}</td>
        <td><button>X</button></td>
      `;

      tr.querySelector("input").onchange = (e) => {
        const val = Number(e.target.value);
        if (val <= 0 || isNaN(val)) {
          carrito.splice(i, 1);
        } else {
          carrito[i].cantidad = val;
        }
        renderCarrito();
      };

      tr.querySelector("button").onclick = () => {
        carrito.splice(i, 1);
        renderCarrito();
      };

      tbody.appendChild(tr);
    });

    document.getElementById("total-label").textContent = total.toFixed(2);
  }

  /* ---------- CÁMARA (QUAGGA) ---------- */
  window.toggleCam = function () {
    const area = document.getElementById("scanner-area");
    if (area.classList.contains("hidden")) {
      area.classList.remove("hidden");
      startQuagga();
    } else {
      area.classList.add("hidden");
      try { Quagga.stop(); } catch(e) {}
    }
  };

  function startQuagga() {
    Quagga.init({
      inputStream: {
        type: "LiveStream",
        target: document.querySelector("#scanner-area"),
        constraints: { facingMode: "environment" }
      },
      decoder: {
        readers: [
          "ean_reader",
          "ean_8_reader",
          "upc_reader",
          "upc_e_reader",
          "code_128_reader",
          "code_39_reader"
        ]
      }
    }, err => {
      if (err) {
        console.error(err);
        return;
      }
      Quagga.start();
    });

    Quagga.onDetected(res => {
      const code = res.codeResult.code;
      buscarCodigo(code);
    });
  }
</script>

</body>
</html>
