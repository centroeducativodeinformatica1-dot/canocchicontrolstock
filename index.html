<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Canocchi POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0;}
.hidden{display:none;}
#login-view{text-align:center;margin-top:60px;}
#login-view img{width:170px;margin-bottom:20px;}
input{width:100%;padding:10px;margin:6px 0;border-radius:6px;border:1px solid #ccc;}
.btn-rojo{background:#E53935;color:#fff;border:none;padding:10px;border-radius:6px;cursor:pointer;}
.btn-negro{background:#000;color:#fff;border:none;padding:10px;border-radius:6px;cursor:pointer;}
.card{background:#fff;padding:15px;border-radius:8px;max-width:900px;margin:15px auto;}
table{width:100%;border-collapse:collapse;}
td,th{border:1px solid #ccc;padding:6px;}
#scanner{width:100%;height:250px;background:#000;margin-top:10px;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-view">
<img src="CanocchiLogo.PNG">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button class="btn-rojo" id="btnLogin">Ingresar</button>
<div id="login-msg" style="color:red;"></div>
</div>

<!-- POS -->
<div id="pos-view" class="hidden card">

<div style="display:flex;justify-content:space-between;">
<h2>Canocchi POS</h2>
<div>
<span id="empleado-label"></span>
<button class="btn-rojo" id="logoutBtn">Salir</button>
</div>
</div>

<hr>

<button class="btn-negro" id="scanBtn">📷 Escanear</button>

<div id="scanner" class="hidden"></div>

<input id="codigo-input" placeholder="Código" />

<table>
<thead>
<tr><th>Nombre</th><th>Precio</th><th></th></tr>
</thead>
<tbody id="carrito"></tbody>
</table>

<h3 style="text-align:right;">Total: $<span id="total">0</span></h3>

<button class="btn-rojo hidden" id="btnPagar">Pagar</button>

</div>

<script type="module">

// 🔥 FIREBASE (TU CONFIG)
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, addDoc, updateDoc, doc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBg4WAoETa4fzO_eia4Nc9PraW_dkmeA4w",
  authDomain: "canocchi-store---stock-control.firebaseapp.com",
  projectId: "canocchi-store---stock-control",
  storageBucket: "canocchi-store---stock-control.firebasestorage.app",
  messagingSenderId: "1062366040495",
  appId: "1:1062366040495:web:2afb9007cc568d11fa1f5a",
  measurementId: "G-9EB87X6949"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// VARIABLES
let carrito = [];
let empleado = null;
let scanning = false;

// ELEMENTOS
const loginView = document.getElementById("login-view");
const posView = document.getElementById("pos-view");
const msg = document.getElementById("login-msg");
const label = document.getElementById("empleado-label");
const carritoBody = document.getElementById("carrito");
const totalLabel = document.getElementById("total");
const btnPagar = document.getElementById("btnPagar");

// LOGIN
document.getElementById("btnLogin").addEventListener("click", async ()=>{
const u = document.getElementById("user").value.trim();
const p = document.getElementById("pass").value.trim();

const q = query(collection(db,"empleados"),
where("usuario","==",u),
where("password","==",p));

const s = await getDocs(q);

if(s.empty){ msg.textContent="Datos incorrectos"; return; }

empleado = u;

loginView.classList.add("hidden");
posView.classList.remove("hidden");
label.textContent = u;
});

// LOGOUT
document.getElementById("logoutBtn").onclick=()=>location.reload();

// BUSCAR PRODUCTO
document.getElementById("codigo-input").addEventListener("keydown",e=>{
if(e.key==="Enter") buscar();
});

async function buscar(codeManual){
const code = codeManual || document.getElementById("codigo-input").value.trim();
if(!code) return;

const q = query(collection(db,"productos"),where("codigo","==",code));
const s = await getDocs(q);

if(s.empty){ alert("No existe"); return; }

const p = s.docs[0].data();

carrito.push(p);
render();
}

// RENDER
function render(){
let t=0;
carritoBody.innerHTML="";

carrito.forEach((p,i)=>{
t+=p.precio;

carritoBody.innerHTML+= <tr> <td>${p.nombre}</td> <td>${p.precio}</td> <td><button onclick="eliminar(${i})">X</button></td> </tr>;
});

totalLabel.textContent=t;

// mostrar botón pagar
btnPagar.classList.toggle("hidden", carrito.length===0);
}

// ELIMINAR
window.eliminar = (i)=>{
carrito.splice(i,1);
render();
};

// SCANNER
document.getElementById("scanBtn").onclick=()=>{
const sc = document.getElementById("scanner");
sc.classList.remove("hidden");

Quagga.init({
inputStream:{type:"LiveStream",target:sc},
decoder:{readers:["ean_reader","code_128_reader"]}
},()=>Quagga.start());

Quagga.onDetected(d=>{
if(scanning) return;
scanning=true;

const code = d.codeResult.code;

Quagga.stop();
sc.classList.add("hidden");

buscar(code);
});
};

// PAGAR
btnPagar.onclick = async ()=>{

const total = Number(totalLabel.textContent);

const metodo = prompt("1-Efectivo 2-QR 3-Transferencia 4-Tarjeta");

let vuelto = 0;

if(metodo==="1"){
const paga = Number(prompt("¿Con cuánto paga?"));
if(paga<total){alert("Monto insuficiente");return;}
vuelto = paga - total;
alert("Vuelto: $" + vuelto);
}

let metodoTxt = {
"1":"Efectivo",
"2":"QR",
"3":"Transferencia",
"4":"Tarjeta"
}[metodo] || "Otro";

// actualizar stock
for(const p of carrito){
const q = query(collection(db,"productos"),where("codigo","==",p.codigo));
const s = await getDocs(q);
const ref = doc(db,"productos",s.docs[0].id);
await updateDoc(ref,{stock:p.stock-1});
}

// guardar venta
await addDoc(collection(db,"ventas"),{
fecha:Date.now(),
empleado,
metodo:metodoTxt,
total,
vuelto,
items:carrito
});

carrito=[];
render();

alert("Venta registrada");
};

</script>
</body>
</html>
