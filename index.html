<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Canocchi POS PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body { font-family: Arial; background:#f5f5f5; margin:0; }
.hidden{display:none;}
.card{background:#fff;padding:15px;border-radius:8px;max-width:900px;margin:15px auto;}
input{width:100%;padding:10px;margin:6px 0;border-radius:6px;border:1px solid #ccc;}
.btn-rojo{background:#E53935;color:#fff;border:none;padding:10px;border-radius:6px;cursor:pointer;}
.btn-negro{background:#000;color:#fff;border:none;padding:10px;border-radius:6px;cursor:pointer;}
table{width:100%;border-collapse:collapse;}
td,th{border:1px solid #ccc;padding:6px;}
#scanner{width:100%;height:250px;background:#000;margin-top:10px;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-view">
<img src="CanocchiLogo.PNG" style="width:170px;">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button class="btn-rojo" onclick="doLogin()">Ingresar</button>
<div id="login-msg"></div>
</div>

<!-- POS -->
<div id="pos-view" class="hidden card">

<div style="display:flex;justify-content:space-between;">
<h2>Canocchi POS</h2>
<div>
<span id="empleado-label"></span>
<button class="btn-rojo" onclick="logout()">Salir</button>
</div>
</div>

<hr>

<button class="btn-negro" onclick="toggleScanner()">📷 Escanear</button>
<button class="btn-negro" onclick="dashboard()">📊 Dashboard</button>
<button class="btn-negro" onclick="historialHoy()">📄 Hoy</button>
<button class="btn-negro" onclick="exportarExcel()">📥 Excel</button>

<div id="scanner" class="hidden"></div>

<input id="codigo-input" placeholder="Código" onkeydown="if(event.key==='Enter')buscarCodigo()">
<button class="btn-rojo" onclick="buscarCodigo()">Agregar</button>

<table>
<thead>
<tr><th>Nombre</th><th>Cant</th><th>Precio</th><th></th></tr>
</thead>
<tbody id="carrito"></tbody>
</table>

<h3 style="text-align:right;">Total: $<span id="total">0</span></h3>

<button class="btn-rojo" onclick="pagar()">Pagar</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore, collection, query, where, getDocs, addDoc, updateDoc, doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "TU_API_KEY",
authDomain: "TU_AUTH",
projectId: "TU_PROJECT"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let carrito = [];
let empleadoActual=null;
let scanning=false;

/* LOGIN /
window.doLogin = async () => {
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;

    const q = query(
        collection(db,"empleados"),
        where("usuario","==",u),
        where("password","==",p)
    );

    const s = await getDocs(q);

    if (s.empty) {
        document.getElementById("login-msg").textContent = "Error login";
        return;
    }

    empleadoActual = u;

    document.getElementById("login-view").classList.add("hidden");
    document.getElementById("pos-view").classList.remove("hidden");
    document.getElementById("empleado-label").textContent = u;
};

/ LOGOUT /
window.logout=()=>location.reload();

/ SCANNER /
window.toggleScanner=()=>{
scanner.classList.toggle("hidden");

if(!scanner.classList.contains("hidden")){
Quagga.init({
inputStream:{type:"LiveStream",target:scanner},
decoder:{readers:["ean_reader","code_128_reader"]}
},()=>Quagga.start());

Quagga.onDetected(d=>{
if(scanning)return;
scanning=true;
const code=d.codeResult.code;
Quagga.stop();
scanner.classList.add("hidden");
buscarCodigo(code);
});
}
};

/ BUSCAR /
window.buscarCodigo=async(codeManual)=>{
const code=codeManual || codigo-input.value;

const q=query(collection(db,"productos"),where("codigo","==",code));
const s=await getDocs(q);

if(s.empty){alert("No existe");return;}

const p=s.docs[0].data();
carrito.push(p);
render();
};

/ RENDER /
function render(){
let t=0;
carrito.innerHTML="";
carrito.forEach((p,i)=>{
t+=p.precio;
carrito.innerHTML+=<tr> <td>${p.nombre}</td> <td>1</td> <td>${p.precio}</td> <td><button onclick="del(${i})">X</button></td> </tr>;
});
total.textContent=t;
}

/ DELETE /
window.del=i=>{carrito.splice(i,1);render();};

/ PAGAR /
window.pagar=async()=>{
for(const p of carrito){
const q=query(collection(db,"productos"),where("codigo","==",p.codigo));
const s=await getDocs(q);
const ref=doc(db,"productos",s.docs[0].id);
await updateDoc(ref,{stock:p.stock-1});
}

await addDoc(collection(db,"ventas"),{
fecha:Date.now(),
empleado:empleadoActual,
total:Number(total.textContent),
items:carrito
});

carrito=[];
render();
alert("Venta OK");
};

/ DASHBOARD /
window.dashboard=async()=>{
const s=await getDocs(collection(db,"ventas"));

let hoy=0, mes=0;
let contador={};

const now=new Date();

s.forEach(d=>{
const v=d.data();
const f=new Date(v.fecha);

if(f.toDateString()===now.toDateString()) hoy+=v.total;
if(f.getMonth()===now.getMonth()) mes+=v.total;

v.items.forEach(i=>{
contador[i.nombre]=(contador[i.nombre]||0)+1;
});
});

const ranking=Object.entries(contador)
.sort((a,b)=>b[1]-a[1])
.slice(0,5)
.map(i=>i[0]+" ("+i[1]+")")
.join("\n");

alert(
"DASHBOARD\n\n"+
"Hoy: $"+hoy+"\n"+
"Mes: $"+mes+"\n\n"+
"Top productos:\n"+ranking
);
};

/ HISTORIAL HOY /
window.historialHoy=async()=>{
const s=await getDocs(collection(db,"ventas"));
let txt="VENTAS HOY\n\n";
const now=new Date();

s.forEach(d=>{
const v=d.data();
const f=new Date(v.fecha);
if(f.toDateString()===now.toDateString()){
txt+=${f.toLocaleTimeString()} - $${v.total}\n;
}
});

alert(txt);
};

/ EXCEL */
window.exportarExcel=async()=>{
const s=await getDocs(collection(db,"ventas"));
let data=[];
s.forEach(d=>data.push(d.data()));

const ws=XLSX.utils.json_to_sheet(data);
const wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"Ventas");
XLSX.writeFile(wb,"ventas.xlsx");
};

</script>
</body>
</html>
