<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Canocchi POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0;}
.hidden{display:none;}
#login-view{text-align:center;margin-top:60px;}
#login-view img{width:170px;margin-bottom:20px;}
input{width:100%;padding:10px;margin:6px 0;border-radius:6px;border:1px solid #ccc;}
.btn{padding:10px;border:none;border-radius:6px;cursor:pointer;}
.btn-rojo{background:#E53935;color:#fff;}
.btn-negro{background:#000;color:#fff;}
.card{background:#fff;padding:15px;border-radius:8px;max-width:900px;margin:15px auto;}
table{width:100%;border-collapse:collapse;}
td,th{border:1px solid #ccc;padding:6px;}
#scanner{width:100%;height:250px;background:#000;margin-top:10px;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-view">
<img src="CanocchiLogo.PNG">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button class="btn btn-rojo" id="btnLogin">Ingresar</button>
<div id="login-msg" style="color:red;"></div>
</div>

<!-- POS -->
<div id="pos-view" class="hidden card">

<div style="display:flex;justify-content:space-between;">
<h2>Canocchi POS</h2>
<div>
<span id="empleado-label"></span>
<button class="btn btn-rojo" id="logoutBtn">Salir</button>
</div>
</div>

<hr>

<button class="btn btn-negro" id="scanBtn">📷 Escanear</button>

<div id="scanner" class="hidden"></div>

<input id="codigo-input" placeholder="Código">

<table>
<thead>
<tr><th>Producto</th><th>Precio</th><th></th></tr>
</thead>
<tbody id="carrito"></tbody>
</table>

<h3 style="text-align:right;">Total: $<span id="total">0</span></h3>

<button class="btn btn-rojo hidden" id="btnPagar">Pagar</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, addDoc, updateDoc, doc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBg4WAoETa4fzO_eia4Nc9PraW_dkmeA4w",
  authDomain: "canocchi-store---stock-control.firebaseapp.com",
  projectId: "canocchi-store---stock-control"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// VARIABLES
let carrito = [];
let empleado = null;

// ELEMENTOS
const loginView = document.getElementById("login-view");
const posView = document.getElementById("pos-view");
const msg = document.getElementById("login-msg");
const label = document.getElementById("empleado-label");
const carritoBody = document.getElementById("carrito");
const totalLabel = document.getElementById("total");
const btnPagar = document.getElementById("btnPagar");

// LOGIN
document.getElementById("btnLogin").addEventListener("click", async ()=>{
const u = document.getElementById("user").value.trim();
const p = document.getElementById("pass").value.trim();

try{
const q = query(collection(db,"empleados"),
where("usuario","==",u),
where("password","==",p));

const s = await getDocs(q);

if(s.empty){
msg.textContent="Usuario o contraseña incorrectos";
return;
}

empleado = u;

loginView.classList.add("hidden");
posView.classList.remove("hidden");
label.textContent = u;

}catch(e){
msg.textContent="Error de conexión";
console.error(e);
}
});

// LOGOUT
document.getElementById("logoutBtn").onclick=()=>location.reload();

// BUSCAR PRODUCTO
document.getElementById("codigo-input").addEventListener("keydown",e=>{
if(e.key==="Enter") buscar();
});

async function buscar(codeManual){
const code = codeManual || document.getElementById("codigo-input").value.trim();
if(!code) return;

const q = query(collection(db,"productos"),where("codigo","==",code));
const s = await getDocs(q);

if(s.empty){ alert("Producto no encontrado"); return; }

const p = s.docs[0].data();

if(p.stock <= 5){
alert("⚠️ Stock bajo: " + p.nombre);
}

carrito.push(p);
render();
}

// RENDER
function render(){
let total=0;
carritoBody.innerHTML="";

carrito.forEach((p,i)=>{
total+=p.precio;

carritoBody.innerHTML+= <tr> <td>${p.nombre}</td> <td>${p.precio}</td> <td><button data-i="${i}" class="delBtn">X</button></td> </tr>;
});

totalLabel.textContent=total;
btnPagar.classList.toggle("hidden", carrito.length===0);

// eliminar dinámico
document.querySelectorAll(".delBtn").forEach(btn=>{
btn.onclick=()=>{
const i = btn.getAttribute("data-i");
carrito.splice(i,1);
render();
};
});
}

// SCANNER
document.getElementById("scanBtn").onclick=()=>{
const sc=document.getElementById("scanner");
sc.classList.remove("hidden");

Quagga.init({
inputStream:{type:"LiveStream",target:sc},
decoder:{readers:["ean_reader","code_128_reader"]}
},()=>Quagga.start());

Quagga.onDetected(d=>{
const code=d.codeResult.code;
Quagga.stop();
sc.classList.add("hidden");
buscar(code);
});
};

// PAGAR
btnPagar.onclick=async()=>{
const total = Number(totalLabel.textContent);

const metodo = prompt("1-Efectivo 2-QR 3-Transferencia 4-Tarjeta");

let vuelto=0;

if(metodo==="1"){
const paga=Number(prompt("¿Con cuánto paga?"));
if(paga<total){alert("Monto insuficiente");return;}
vuelto=paga-total;
}

// venta
const venta={
fecha:Date.now(),
empleado,
metodo,
total,
vuelto,
items:carrito
};

await addDoc(collection(db,"ventas"),venta);

// ticket
imprimirTicket(venta);

// actualizar stock
for(const p of carrito){
const q=query(collection(db,"productos"),where("codigo","==",p.codigo));
const s=await getDocs(q);
const ref=doc(db,"productos",s.docs[0].id);
await updateDoc(ref,{stock:p.stock-1});
}

carrito=[];
render();
};

// TICKET (100% seguro sin romper JS)
function imprimirTicket(v){

const html = `
<html>
<body style="font-family:monospace">

<h3>CANOCCHI STORE</h3>
${new Date(v.fecha).toLocaleString()}

<hr>

${v.items.map(i => ${i.nombre} $${i.precio}).join("<br>")}

<hr>

TOTAL: $${v.total}<br>
${v.vuelto ? "Vuelto: $" + v.vuelto : ""}

</body>
</html>
`;

const w = window.open("");
w.document.write(html);
w.document.close();
w.print();
}
